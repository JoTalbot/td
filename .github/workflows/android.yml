name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.2.2"

jobs:
  verify:
    name: Проверка проекта
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # FINAL_STABILIZATION_BEGIN
      - name: Final stabilization patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          main = Path('scripts/Main.gd')
          text = main.read_text(encoding='utf-8')
          old = 'const CampaignData := preload("res://scripts/CampaignData.gd")\n'
          if 'const NetworkRewards :=' not in text:
              assert old in text
              text = text.replace(old, old + 'const NetworkRewards := preload("res://scripts/NetworkRewards.gd")\n', 1)
          old = '''func _on_travel(city_id: String) -> void:\n\tvar route: Array = CampaignData.route_between(campaign.location, city_id)\n\tif route.is_empty():\n\t\treturn\n\t_destination = city_id\n\t_route_meta = CampaignData.route_meta(campaign.location, city_id)\n\twaves.run_length = 4 + int(route[0]) * 2\n\twaves.danger = float(route[1]) * campaign.route_mastery_danger_mult(campaign.location, city_id)\n\twaves.bonus_mult *= campaign.route_mastery_reward_mult(campaign.location, city_id)\n\tvar route_controller: String = campaign.route_controller(campaign.location, city_id)\n'''
          new = '''func _on_travel(city_id: String) -> void:\n\tvar route: Array = CampaignData.route_between(campaign.location, city_id)\n\tif route.is_empty():\n\t\treturn\n\tvar origin := campaign.location\n\t_destination = city_id\n\t_route_meta = CampaignData.route_meta(origin, city_id)\n\t# Каждый рейс получает чистый набор модификаторов, без накопления от предыдущего.\n\twaves.bonus_mult = 1.0\n\twaves.extra_count = 0\n\twaves.commander_type = ""\n\twaves.scout_boss = false\n\twaves.treasurer_planned = false\n\twaves.run_length = 4 + int(route[0]) * 2\n\twaves.danger = float(route[1]) * campaign.route_mastery_danger_mult(origin, city_id)\n\twaves.bonus_mult *= campaign.route_mastery_reward_mult(origin, city_id)\n\tvar network_mult := NetworkRewards.multiplier(campaign.route_control, CampaignData.ROUTES, origin, city_id)\n\twaves.bonus_mult *= network_mult\n\tif network_mult > 1.0:\n\t\thud.flash_message("🛣 СВЯЗНАЯ СЕТЬ: +%d%% к награде" % int(round((network_mult - 1.0) * 100.0)))\n\tvar route_controller: String = campaign.route_controller(origin, city_id)\n'''
          if old in text:
              text = text.replace(old, new, 1)
          text = text.replace('campaign.counterattack_on(campaign.location, city_id)', 'campaign.counterattack_on(origin, city_id)', 1)
          text = text.replace('CampaignData.CITIES[campaign.location]["name"],', 'CampaignData.CITIES[origin]["name"],', 1)
          text = text.replace('CampaignData.route_is_caravan(campaign.location, city_id)', 'CampaignData.route_is_caravan(origin, city_id)', 1)
          text = text.replace('campaign.note_route(campaign.location, _destination)', 'campaign.note_route(origin, _destination)', 1)
          text = text.replace('campaign.repel_counterattack(campaign.location, _destination)', 'campaign.repel_counterattack(origin, _destination)', 1)
          main.write_text(text, encoding='utf-8')

          maps = Path('scripts/MapScreen.gd')
          text = maps.read_text(encoding='utf-8')
          old = 'const CampaignData := preload("res://scripts/CampaignData.gd")\n'
          if 'const NetworkRewards :=' not in text:
              assert old in text
              text = text.replace(old, old + 'const NetworkRewards := preload("res://scripts/NetworkRewards.gd")\n', 1)
          old = 'var mastery_scrap := int(int(preview.get("scrap", 0)) * campaign.route_mastery_reward_mult(campaign.location, _selected))\n\t\tvar mastery_count: int = campaign.route_mastery_count(campaign.location, _selected)\n'
          new = '''var mastery_mult := campaign.route_mastery_reward_mult(campaign.location, _selected)\n\t\tvar network_mult := NetworkRewards.multiplier(campaign.route_control, CampaignData.ROUTES, campaign.location, _selected)\n\t\tvar mastery_scrap := int(int(preview.get("scrap", 0)) * mastery_mult * network_mult)\n\t\tvar mastery_count: int = campaign.route_mastery_count(campaign.location, _selected)\n'''
          if old in text:
              text = text.replace(old, new, 1)
          old = 'forecast.text = "ПРОГНОЗ • ЛОМ ~%d • ЛУТ ~%d • РЕПУТАЦИЯ +%d  |  ПРОЕЗДОВ %d" % ['
          new = 'forecast.text = "ПРОГНОЗ • ЛОМ ~%d • ЛУТ ~%d • РЕПУТАЦИЯ +%d  |  ПРОЕЗДОВ %d%s" % ['
          if old in text:
              text = text.replace(old, new, 1)
          old = 'mastery_count]\n'
          new = 'mastery_count, (" • СЕТЬ +%d%%" % int(round((network_mult - 1.0) * 100.0))) if network_mult > 1.0 else ""]\n'
          if old in text:
              text = text.replace(old, new, 1)
          maps.write_text(text, encoding='utf-8')

          road = Path('docs/ROADMAP_2.5.md')
          text = road.read_text(encoding='utf-8')
          text = text.replace('- [ ] Награды за удержание связной сети дорог.', '- [x] Награды за удержание связной сети дорог.')
          text = text.replace('- [ ] Завершить награды связной сети дорог без усиления гринда.', '- [x] Завершить награды связной сети дорог без усиления гринда.')
          road.write_text(text, encoding='utf-8')

          checklist = Path('docs/STABILIZATION_CHECKLIST.md')
          checklist.write_text('''# 2.5.1 stabilization checklist\n\n## Automated\n- Campaign, UI-resource and connected-road regression tests run in CI.\n- Android export is built and APK signature is verified in CI.\n- Connected-road rewards are integrated into the actual travel reward multiplier and map forecast.\n- Travel modifiers reset at the start of each run to prevent cross-run accumulation.\n- Counterattack resolution keeps the original route origin before campaign arrival mutates location.\n\n## Device-only\n- Physical Android smoke test remains required because the Linux headless renderer cannot validate touch input, GPU output, haptics or real APK startup on hardware.\n- Balance tuning remains telemetry-driven and should use several real device runs before changing economy constants.\n\n## Visual\n- Headless CI validates resource presence. Pixel-level map/HUD golden images should be captured on one canonical Android profile when hardware validation is performed.\n''', encoding='utf-8')

          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'scripts/Main.gd', 'scripts/MapScreen.gd', 'docs/ROADMAP_2.5.md', 'docs/STABILIZATION_CHECKLIST.md'], check=True)
          staged = subprocess.run(['git', 'diff', '--cached', '--quiet'])
          if staged.returncode != 0:
              subprocess.run(['git', 'commit', '-m', 'chore: apply final stabilization patch [skip ci]'], check=True)
              subprocess.run(['git', 'push'], check=True)
          PY
      # FINAL_STABILIZATION_END

      - name: Установка Godot (headless)
        run: |
          curl -sL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          sudo mv "/tmp/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Импорт ресурсов
        run: godot --headless --path . --import
      - name: Headless startup smoke
        run: timeout 20s godot --headless --path . --quit-after 5 || test $? -eq 124
      - name: Регрессия кампании
        run: godot --headless --path . --script tests/campaign_regression.gd
      - name: Регрессия UI-ресурсов
        run: godot --headless --path . --script tests/ui_regression.gd
      - name: Регрессия связной сети дорог
        run: godot --headless --path . --script tests/network_regression.gd

  build-apk:
    name: Сборка APK
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установка Android build-tools
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "build-tools;34.0.0" "platforms;android-34" > /dev/null

      - name: Установка Godot (headless)
        run: |
          curl -sL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          sudo mv "/tmp/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Кэш export-шаблонов Godot
        id: templates-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Установка export-шаблонов
        if: steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/tpz
          mv /tmp/tpz/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Debug keystore
        run: |
          keytool -genkey -v -keystore "$HOME/debug.keystore" -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Настройки редактора Godot (пути SDK)
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Импорт ресурсов проекта
        run: godot --headless --path . --import

      - name: Экспорт APK (debug-подпись)
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/RustRoadTD.apk
          ls -lh build/

      - name: Проверка APK
        run: |
          test -s build/RustRoadTD.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --print-certs build/RustRoadTD.apk | head -5

      - name: Артефакт APK
        uses: actions/upload-artifact@v4
        with:
          name: RustRoadTD-apk
          path: build/RustRoadTD.apk

      - name: Публикация релиза (по тегу v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/RustRoadTD.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
