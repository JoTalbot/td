name: One-shot strict typing repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strict-typing-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair strict GDScript inference
        run: |
          sed -i 's/var mastery_mult := campaign\.route_mastery_reward_mult/var mastery_mult: float = campaign.route_mastery_reward_mult/' scripts/MapScreen.gd
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/MapScreen.gd .github/workflows/strict-typing-fix.yml
          git rm .github/workflows/strict-typing-fix.yml
          git diff --cached --check
          git commit -m 'fix: satisfy strict typing in map forecast [skip ci]'
          git push
